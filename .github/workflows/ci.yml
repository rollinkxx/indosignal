name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable pnpm 10.34.5
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Require handoff task-row update for implementation PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:handoff-update "$BASE_SHA" "$HEAD_SHA"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Check market mocks
        run: pnpm check:market-mocks
      - name: Check Docker security
        run: pnpm check:docker-security
      - name: Build production Docker image
        run: |
          image="indosignal:ci-${GITHUB_SHA}"
          docker build --pull --file Dockerfile --tag "$image" .
          docker image inspect "$image" >/dev/null
          docker image rm "$image"
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level high
